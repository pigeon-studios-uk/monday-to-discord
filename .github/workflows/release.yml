name: Release

# Push a tag such as v2.0.0 to publish a release. The tag must match the version in package.json,
# and CHANGELOG.md must have a section for it; its text becomes the release notes.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"; exit 1; }

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG.md section for $version"; exit 1; }

      - name: Build monday-to-discord.zip
        run: git archive --format=zip --prefix=monday-to-discord/ -o monday-to-discord.zip "$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" monday-to-discord.zip --title "Monday to Discord $GITHUB_REF_NAME" --notes-file notes.md
